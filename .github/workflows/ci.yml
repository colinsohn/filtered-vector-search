name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Run unit, planner, and race tests
        run: go test -race -v ./...
      - name: Run small benchmark
        run: go run ./cmd/bench -scale small
